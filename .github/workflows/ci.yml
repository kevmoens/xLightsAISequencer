name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build, test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: macOS Intel
            os: macos-15-intel
            rid: osx-x64
          - name: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore XlightsAI.Studio.slnx

      - name: Format check (no Python required)
        if: matrix.rid == 'win-x64'
        run: dotnet format XlightsAI.Studio.slnx --verify-no-changes

      - name: Build (Release)
        run: dotnet build XlightsAI.Studio.slnx -c Release --no-restore

      - name: Test - Golden (pinned reference / fixture-corpus)
        if: always()
        run: >
          dotnet test XlightsAI.Studio.slnx -c Release --no-build
          --filter "Category=Golden"
          --logger "trx;LogFileName=golden.trx"
          --results-directory TestResults

      - name: Test - Unit
        if: always()
        run: >
          dotnet test XlightsAI.Studio.slnx -c Release --no-build
          --filter "Category=Unit"
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Test - Integration
        if: always()
        run: >
          dotnet test XlightsAI.Studio.slnx -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.rid }}
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Publish app (self-contained, ${{ matrix.rid }})
        run: >
          dotnet publish src/XlightsAI.Studio.App/XlightsAI.Studio.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o publish/${{ matrix.rid }}

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: XlightsAI.Studio-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
