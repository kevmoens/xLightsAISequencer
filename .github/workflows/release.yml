name: Release

# Push a tag like v0.1.0 to build Velopack installers + update feeds and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            channel: win
          - name: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            channel: osx-x64
          - name: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            channel: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Publish app
        shell: bash
        run: >
          dotnet publish src/XlightsAI.Studio.App/XlightsAI.Studio.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=$VERSION -o publish

      - name: Pack with Velopack
        shell: bash
        run: >
          vpk pack
          --packId XlightsAI.Studio
          --packVersion "$VERSION"
          --packDir publish
          --mainExe ${{ runner.os == 'Windows' && 'XlightsAI.Studio.exe' || 'XlightsAI.Studio' }}
          --packTitle "xLights AI Sequencer"
          --channel ${{ matrix.channel }}
          --runtime ${{ matrix.rid }}
          ${{ runner.os == 'Windows' && '--noPortable' || '' }}
          --outputDir Releases

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: Releases/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: Releases
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" Releases/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
